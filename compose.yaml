services:
  backend:
    build: .
    env_file:
      - .env
    ports:
      - "8000:8000"

  telegram:
    build: .
    env_file:
      - .env
    command: python -m backend.telegram_bot

  website:
    image: nginx:alpine
    ports:
      - "5500:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro